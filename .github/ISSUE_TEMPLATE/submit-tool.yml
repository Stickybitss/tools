name: Enviar herramienta
description: Propón una herramienta de tu autoría para el directorio de StickyBit
title: "[Herramienta]: "
labels: ["nueva-herramienta"]
body:
  - type: input
    id: name
    attributes:
      label: Nombre de la herramienta
      description: El nombre del software o proyecto (ej. ADAutoGraph, SubZero, HTB-CLI).
      placeholder: MiHerramienta
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: URL del repositorio o de la web
      description: Un repositorio público de GitHub o la web de tu herramienta (https).
      placeholder: https://github.com/usuario/mi-herramienta
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: Breve resumen de qué hace (opcional si el repositorio de GitHub ya tiene descripción).
    validations:
      required: false
  - type: dropdown
    id: category
    attributes:
      label: Categoría
      options: [recon, osint, web, network, defensive, ctf, forensics, other]
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Separados por comas, máximo 6 (ej. python, cli, api).
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmaciones
      options:
        - label: Soy el autor o tengo permiso del autor para publicarla.
          required: true
        - label: Si es un repositorio, tiene licencia y un README con instrucciones de uso. Si es una web, es pública y accesible.
          required: true
        - label: No contiene malware, ransomware, datos filtrados ni está pensada para uso malicioso.
          required: true
